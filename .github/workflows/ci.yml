name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQL syntax (basic)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          echo 'Basic schema parse check (psql dry run not connected).'
      - name: Lint OpenAPI YAML
        run: |
          python - <<'PY'
          import yaml
          with open('openapi.yaml', 'r', encoding='utf-8') as f:
            yaml.safe_load(f)
          print('openapi.yaml valid YAML')
          PY
